# 本地开发专用：与 docker-compose.yml 合并使用，不上传到服务器启动命令中。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imp_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-imp}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-imp_local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-imp_local_storage_password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object-data:/data"]
    restart: unless-stopped
  api:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-imp}:${POSTGRES_PASSWORD:-imp_local_password}@db:5432/${POSTGRES_DB:-imp}?schema=public
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: http://storage:9000
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }
volumes:
  postgres-data:
  object-data:
