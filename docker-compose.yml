services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imp_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-imp}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-imp_local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-imp_local_storage_password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object-data:/data"]
    restart: unless-stopped
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DOUYIN_CLIENT_KEY: ${DOUYIN_CLIENT_KEY:-}
      DOUYIN_CLIENT_SECRET: ${DOUYIN_CLIENT_SECRET:-}
      DOUYIN_REDIRECT_URI: ${DOUYIN_REDIRECT_URI:-}
      DOUYIN_SCOPES: ${DOUYIN_SCOPES:-user_info}
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY:-}
      DOUYIN_DEMO_ENABLED: ${DOUYIN_DEMO_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-imp}:${POSTGRES_PASSWORD:-imp_local_password}@db:5432/${POSTGRES_DB:-imp}?schema=public
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: imp-files
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-imp_local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-imp_local_storage_password}
      BOOTSTRAP_PHONE: ${BOOTSTRAP_PHONE:-13800138000}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Copy .env.example to .env and set BOOTSTRAP_PASSWORD}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-运营管理员}
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }
    command:
      [
        "sh",
        "-c",
        "npm run storage:init && npm run db:migrate && npm run db:seed && npm run start -w @imp/api",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres-data:
  object-data:
