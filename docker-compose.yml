# 服务器部署：仅运行应用，数据库使用阿里云 PostgreSQL，文件使用 OSS。
services:
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-loopback,uniquelocal}
      WORKFLOW_PROVIDER_URL: ${WORKFLOW_PROVIDER_URL:-}
      WORKFLOW_PROVIDER_KEY: ${WORKFLOW_PROVIDER_KEY:-}
      WORKFLOW_MODEL_MAP: ${WORKFLOW_MODEL_MAP:-{}}
      WORKFLOW_OUTPUT_HOSTS: ${WORKFLOW_OUTPUT_HOSTS:-}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      DOUYIN_CLIENT_KEY: ${DOUYIN_CLIENT_KEY:-}
      DOUYIN_CLIENT_SECRET: ${DOUYIN_CLIENT_SECRET:-}
      DOUYIN_REDIRECT_URI: ${DOUYIN_REDIRECT_URI:-}
      DOUYIN_VIDEO_API_PROFILE: ${DOUYIN_VIDEO_API_PROFILE:-disabled}
      DOUYIN_FANS_SYNC_ENABLED: ${DOUYIN_FANS_SYNC_ENABLED:-false}
      DOUYIN_SCOPES: ${DOUYIN_SCOPES:-user_info}
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY:-}
      DOUYIN_DEMO_ENABLED: ${DOUYIN_DEMO_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:?请在根目录 .env 中填写阿里云 PostgreSQL 连接地址}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-oss}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_DOMAIN: ${OSS_ACCESS_DOMAIN:-}
      # 仅访问历史 S3 文件时配置；云端部署不启动本地存储容器。
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      BOOTSTRAP_PHONE: ${BOOTSTRAP_PHONE:-13800138000}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Copy .env.example to .env and set BOOTSTRAP_PASSWORD}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-运营管理员}
    command:
      [
        "sh",
        "-c",
        "npm run storage:init && npm run db:migrate && npm run db:seed && npm run start -w @imp/api",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
